name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build extension
        run: yarn package

      - name: Smoke Tree-sitter wasm
        run: |
          test -f dist/tree-sitter/tree-sitter.wasm
          test -f dist/tree-sitter/tree-sitter-typescript.wasm
          node -e "
            const path=require('path');
            const root=path.join(process.cwd(),'dist/tree-sitter');
            const mod=require(path.join(root,'tree-sitter.js'));
            (async()=>{
              await mod.Parser.init({locateFile:n=>path.join(root,path.basename(n))});
              const lang=await mod.Language.load(path.join(root,'tree-sitter-typescript.wasm'));
              const p=new mod.Parser(); p.setLanguage(lang);
              const tree=p.parse('export function ok(){return 1}');
              if(!tree.rootNode) throw new Error('parse failed');
              console.log('tree-sitter smoke ok');
            })().catch(e=>{console.error(e); process.exit(1);});
          "

      - name: Package VSIX
        run: yarn package:vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haratsan-vsix
          path: haratsan-*.vsix
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: haratsan-*.vsix
          generate_release_notes: true
